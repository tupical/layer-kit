[package]
name = "layer-kit"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0 WITH Commons-Clause"

[lib]
path = "src/lib.rs"

[dependencies]
# `ai` is the lib-level seam shared by torii/satori/yatagarasu's lib crates:
# zero heavy deps, so depending on layer-kit for it does not pull
# axum/tokio/reqwest into a layer's lib dependency tree.
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# `auth` / `openai` / `serve` are server-only infra, gated behind `server` so
# lib crates never see them.
axum    = { version = "0.7", optional = true }
tokio   = { version = "1.40", features = ["macros", "rt-multi-thread", "net", "signal"], optional = true }
hmac    = { version = "0.12", optional = true }
sha2    = { version = "0.10", optional = true }
base64  = { version = "0.22", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
tracing = { version = "0.1", optional = true }

[features]
default = []
server = ["dep:axum", "dep:tokio", "dep:hmac", "dep:sha2", "dep:base64", "dep:reqwest", "dep:tracing"]
